<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- GitHub Pages 边缘缓存最长10分钟，手机浏览器还会再缓存 HTML：禁缓存让每次打开都拉最新版（JS/CSS 带内容哈希不受影响） -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>虚拟手机模拟器</title>
    <style>
      /* 这里只保留布局重置；主题颜色使用应用 CSS 语义变量。 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
